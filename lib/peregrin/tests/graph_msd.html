<script>window.GRAPH_STATE = {"style": {"lw": 1.0, "faceColor": "#ffffff", "gridColor": "#dcdcdc", "gridLw": 0.75}};</script>
<script>(function () {
  const S = window.GRAPH_STATE || {};

  // Immutable snapshot of the initial style so "Refresh" can restore the
  // graph after the user edits colours / line widths (applyEdit mutates
  // S.style in place).
  const ORIGINAL_STYLE = Object.assign({}, S.style);

  // Declared before init() runs; const/let are not hoisted.
  let lensCount = 0;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const FISHEYE_STRENGTH = 0.05; // 0 = flat glass, <1 = centre magnification 1/(1-s)
  const BACKDROP_BLUR = 'blur(2px)';

  // ---- inject CSS for the tooltip --------------------
  if (!document.getElementById('peregrin-graph-style')) {
    const style = document.createElement('style');
    style.id = 'peregrin-graph-style';
    style.textContent = ".peregrin-graph {\n  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;\n}\n\n.peregrin-graph .pg-tooltip {\n  display: none;\n  position: absolute;\n  z-index: 99;\n  padding: 0.4rem 0.8rem 1rem 0.8rem;\n  background: rgba(255, 255, 255, 0.975);\n  border: 1px solid #ddd;\n  border-radius: 1rem;\n  box-shadow: 1px 4px 18px 2px rgba(35, 35, 35, 0.25);\n  font-size: 13px;\n  width: 13rem;\n  max-height: 22rem;\n  overflow: auto;\n  transition: background 0.1s ease;\n}\n.peregrin-graph .pg-tooltip.pg-dragged {\n  background: rgba(255, 255, 255, 0.9);\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar {\n  width: 0.4rem;\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar-thumb {\n  background-color: rgba(0, 0, 0, 0.275);\n  border-radius: 0.2rem;\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar-thumb:hover {\n  background-color: rgba(0, 0, 0, 0.4);\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar-track { \n  margin-block: 0.9rem;\n  background: transparent;\n}\n\n.peregrin-graph .pg-tooltip .pg-header {\n  position: absolute;\n  top: 0.3rem;\n  width: calc(100% - 2.6rem);\n  cursor: move;\n  user-select: none;\n  touch-action: none;\n  cursor: grab;\n}\n.peregrin-graph .pg-tooltip.pg-dragged .pg-header {\n  cursor: grabbing;\n}\n\n.peregrin-graph .pg-tooltip .pg-close {\n  position: relative;\n  top: -0.1rem;\n  left: calc(100% - 0.5rem);\n  height: 1rem;\n  width: 1rem;\n  cursor: pointer;\n  color: #555;\n}\n.peregrin-graph .pg-tooltip .pg-close:hover {\n  color: black;\n}\n\n\n.peregrin-graph .pg-tooltip input[type=\"color\"] {\n  appearance: none;\n  -moz-appearance: none;\n  -webkit-appearance: none;\n  padding: 0;\n  border: none;\n  height: 2rem;\n  width: calc(100%);\n  cursor: pointer;\n  margin-top: 0.4rem;\n}\n\n*:focus{\n  border-radius: 0;\n  outline: none;\n}\n\n::-webkit-color-swatch-wrapper {\n  padding: 0;\n}\n\n::-webkit-color-swatch{\n  border: none;\n  border-left: 3px solid #aaa;\n}\n\n::-moz-color-swatch,\n::-moz-focus-inner{\n  border: 0;\n}\n\n.peregrin-graph .pg-tooltip input[type=\"range\"] {\n  -webkit-appearance: none;  /* Override default CSS styles */\n  appearance: none;\n  width: 100%;\n  height: 3px;\n  border-radius: 0.8rem; \n  background: #aaa;\n  margin: 0.6rem 0 0.6rem 0;\n}\n.peregrin-graph .pg-tooltip input[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none;\n  appearance: none;\n  width: 0.9rem;\n  height: 0.9rem;\n  border-radius: 50%;\n  border: 3px solid #999;\n  background: #fff;\n  cursor: pointer;\n  transition: background 0.1s ease;\n}\n.peregrin-graph .pg-tooltip input[type=\"range\"]::-webkit-slider-thumb:hover {\n  background: #999;\n}\n\n.pg-graph-submenu {\n  display: flex;\n  margin-top: 0.6rem;\n  gap: 0.6rem;\n}\n.pg-graph-submenu > button {\n  display: inline-flex;\n  align-items: center;\n  padding: 0.4rem 0.5rem 0.4rem 0.5rem;\n  gap: 0.3rem;\n  border-radius: 0.4rem;\n  border: none;\n  background: #ddd;\n  cursor: pointer;\n  transition: background 0.1s ease, color 0.1s ease;\n}\n.pg-graph-submenu > button:hover {\n  background: #ccc;\n}\n.pg-graph-submenu > button[data-act=\"refresh\"]:hover { \n  background: #ed5e5e;\n  color: white;\n}\n\n.peregrin-graph .pg-tooltip select {\n  width: 100%;\n}\n\n.pg-row {\n  margin: 0.6rem 0 0.6rem 0;\n}";
    document.head.appendChild(style);
  }

  document.querySelectorAll('.peregrin-graph:not([data-pg-init])').forEach(init);

  function init(root) {
    root.dataset.pgInit = '1';
    const svg = root.querySelector('svg');
    if (!svg) return;

    const DRAWABLE = 'path,line,rect,circle,polygon,polyline,use';

    // Collect every element whose own id starts with `prefix`, OR that lives
    // inside a <g> whose id starts with `prefix`. Matplotlib emits gids as ids
    // on wrapping <g> groups (and sometimes appends suffixes / dedup numbers),
    // so we resolve to the drawable leaves inside those groups.
    function collect(prefix) {
      const roots = svg.querySelectorAll(`[id^="${prefix}"]`);
      const out = new Set();
      roots.forEach(node => {
        if (node.matches(DRAWABLE)) out.add(node);
        node.querySelectorAll(DRAWABLE).forEach(el => out.add(el));
      });
      return [...out];
    }

    const groups = {
      tracks: collect('pg:tracks'),
      heads: collect('pg:heads'),
      grid: collect('pg:grid'),
      background: collect('pg:canvas'),
      figure: collect('pg:figure')
    };

    // Hit targets = the original gid-tagged nodes (groups), so right-click works
    // even on the transparent group wrapper.
    const hitNodes = prefix => [...svg.querySelectorAll(`[id^="${prefix}"]`)];

    const tip = document.createElement('div');
    tip.className = 'pg-tooltip';
    root.appendChild(tip);

    const lens = createFisheyeLens(tip);

    // ---- drag the panel by its header ----
    let drag = null;
    tip.addEventListener('pointerdown', e => {
      if (e.button !== 0 || !e.target.closest('.pg-header')) return;
      drag = {
        id: e.pointerId,
        x: e.clientX,
        y: e.clientY,
        left: parseFloat(tip.style.left) || 0,
        top: parseFloat(tip.style.top) || 0,
      };
      tip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    tip.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      tip.style.left = drag.left + e.clientX - drag.x + 'px';
      tip.style.top = drag.top + e.clientY - drag.y + 'px';
      tip.classList.add('pg-dragged');
    });
    const endDrag = e => {
      if (!drag || e.pointerId !== drag.id) return;
      tip.releasePointerCapture(e.pointerId);
      tip.classList.remove('pg-dragged');
      drag = null;
    };
    tip.addEventListener('pointerup', endDrag);
    tip.addEventListener('pointercancel', endDrag);

    // ---- attribute editing helpers (mutate SVG in place) ----
    // Only override an attribute if it isn't explicitly "none" (preserves
    // fill-only / stroke-only artists like unfilled head markers).
    function setStroke(nodes, v) {
      nodes.forEach(p => {
        if (p.getAttribute('stroke') !== 'none') p.setAttribute('stroke', v);
        // matplotlib sometimes puts color in inline style
        if (p.style && p.style.stroke && p.style.stroke !== 'none') p.style.stroke = v;
      });
    }
    function setFill(nodes, v) {
      nodes.forEach(p => {
        if (p.getAttribute('fill') !== 'none') p.setAttribute('fill', v);
        if (p.style && p.style.fill && p.style.fill !== 'none') p.style.fill = v;
      });
    }
    function setStrokeWidth(nodes, v) {
      nodes.forEach(p => {
        p.setAttribute('stroke-width', v);
        if (p.style && p.style.strokeWidth) p.style.strokeWidth = v;
      });
    }
    function setScale(nodes, value) {
      const scale = Number(value);
      if (!Number.isFinite(scale) || scale <= 0) return;

      const uses = nodes.filter(
        node => node.localName === 'use' && !node.closest('defs')

      // Scaling the definition preserves every <use x="..." y="..."> position.
      const definitions = new Set();

      uses.forEach(use => {
        const href =
          use.getAttribute('href') ||
          use.getAttribute('xlink:href') ||
          use.getAttributeNS('http://www.w3.org/1999/xlink', 'href');

        if (!href || !href.startsWith('#')) return;

        const id = href.slice(1);
        const definition = [...svg.querySelectorAll('defs [id]')]
          .find(node => node.id === id);

        if (definition) definitions.add(definition);
      });

      function scaleAroundCenter(node) {
        if (node.dataset.pgBaseTransform === undefined) {
          node.dataset.pgBaseTransform =
            node.getAttribute('transform') || '';
        }

        let cx = 0;
        let cy = 0;

        try {
          const box = node.getBBox();
          cx = box.x + box.width / 2;
          cy = box.y + box.height / 2;
        } catch (_) {
          // Matplotlib marker definitions normally use (0, 0) as their center.
        }

        const scaling =
          `translate(${cx} ${cy}) scale(${scale}) translate(${-cx} ${-cy})`;

        const transform = [
          node.dataset.pgBaseTransform,
          scaling,
        ].filter(Boolean).join(' ');

        node.setAttribute('transform', transform);
      }

        definitions.forEach(scaleAroundCenter);

      }

        .filter(node => !node.closest('defs'))
        .forEach(scaleAroundCenter);

        lw: v => setStrokeWidth(groups.tracks, v),
        headColor: v => {
          setStroke(groups.heads, v);
          setFill(groups.heads, v);
        },
        headSize: v => setScale(groups.heads, v),
      },

        gridColor: v => setStroke(groups.grid, v),

    function applyEdit(grp, key, value) {
      const fn = EDITORS[grp] && EDITORS[grp][key];
      if (fn) fn(value);
      if (S.style) S.style[key] = value;
    }

    // ---- export / refresh helpers ----
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Clone the live SVG (reflecting any edits) and make it standalone.
    function serializeSvg() {
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', SVG_NS);
      clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      return new XMLSerializer().serializeToString(clone);
    }

    function svgPixelSize() {
      const rect = svg.getBoundingClientRect();
      let w = rect.width;
      let h = rect.height;
      if (!w || !h) {
        const vb = svg.getAttribute('viewBox');
        if (vb) {
          const parts = vb.split(/[ ,]+/).map(Number);
          w = parts[2];
          h = parts[3];
        }
      }
      return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
    }

    function exportSVG() {
      const blob = new Blob([serializeSvg()], {
        type: 'image/svg+xml;charset=utf-8',
      });
      triggerDownload(blob, 'graph.svg');
    }

    function exportPNG() {
      const { w, h } = svgPixelSize();
      const scale = 2; // render at 2x for a crisper raster
      const source = serializeSvg();
      const svgUrl =
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (blob) triggerDownload(blob, 'graph.png');
        }, 'image/png');
      };
      img.src = svgUrl;
    }

    // Restore every editable attribute to the value it had on first render.
    function refresh() {
      const o = ORIGINAL_STYLE;
      const trackColor = o.trackColor ?? '#000000';
      setStroke(groups.tracks, trackColor);
      setStroke(groups.heads, trackColor);
      setFill(groups.heads, trackColor);
      setStrokeWidth(groups.tracks, o.lw ?? 1);
      setScale(groups.heads, o.headSize ?? 1);
      setStroke(groups.grid, o.gridColor ?? '#dcdcdc');
      setStrokeWidth(groups.grid, o.gridLw ?? 0.75);
      setFill(groups.background, o.faceColor ?? '#ffffff');
      if (S.style) Object.assign(S.style, o);

      // Reset any inputs currently shown in the open panel.
      const values = {
        color: hex(trackColor, '#000000'),
        headColor: hex(trackColor, '#000000'),
        lw: o.lw ?? 1,
        headSize: o.headSize ?? 1,
        gridColor: hex(o.gridColor, '#dcdcdc'),
        gridLw: o.gridLw ?? 0.75,
        faceColor: hex(o.faceColor, '#ffffff'),
      };
      tip.querySelectorAll('[data-k]').forEach(el => {
        if (el.dataset.k in values) el.value = values[el.dataset.k];
      });
    }

    // ---- tooltip UI ----
    const header       = `<div class="pg-header">⋮⋮ <i>tooltip</i></div>`;
    const closeButton  = `<span class="pg-close">✕</span>`;
    const exportIcon =
      `<svg class="pg-btn-icon" xmlns="http://www.w3.org/2000/svg" height="1rem" viewBox="0 -960 960 960" width="1rem" fill="currentColor"><path d="M480-480ZM202-65l-56-57 118-118h-90v-80h226v226h-80v-89L202-65Zm278-15v-80h240v-440H520v-200H240v400h-80v-400q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H480Z"/></svg>`;
    const refreshIcon =
      `<svg class="pg-btn-icon" xmlns="http://www.w3.org/2000/svg" height="1rem" viewBox="0 -960 960 960" width="1rem" fill="currentColor"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>`;
    const graphSubmenu = 
      `<div class="pg-graph-submenu">
        <button type="button" data-act="svg">${exportIcon}SVG</button> <button type="button" data-act="png">${exportIcon}PNG</button> <button type="button" data-act="refresh" title="Refresh">${refreshIcon}</button>
      </div>`;
    const row = (label, input) =>
      `<div class="pg-row"><label>${label}</label><br>${input}</div>`;


    function showTip(x, y, html) {
      tip.innerHTML = html;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
      tip.style.display = 'block';
      lens.update();
      tip.querySelectorAll('[data-k]').forEach(el => {
        el.addEventListener('input', () => {
          let v = el.value;
          if (el.type === 'range') v = parseFloat(v);
          applyEdit(el.dataset.grp, el.dataset.k, v);
        });
      });
      const close = tip.querySelector('.pg-close');
      if (close) close.onclick = () => (tip.style.display = 'none');
      tip.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          if (act === 'svg') exportSVG();
          else if (act === 'png') exportPNG();
          else if (act === 'refresh') refresh();
        };
      });
    }

    const st = S.style || {};
    const hex = (c, fallback) => (c || fallback).slice(0, 7); // color input needs #rrggbb

    const MENUS = {
      figure: (x, y) => showTip(x, y, closeButton + header + graphSubmenu
        + row('Color', `<input type="color" data-grp="tracks" data-k="color" value="${hex(st.trackColor, '#000000')}">`)
        + row('Head color', `<input type="color" data-grp="tracks" data-k="headColor" value="${hex(st.trackColor, '#000000')}">`)
        + row('Line width', `<input type="range" data-grp="tracks" data-k="lw" min="0" max="2" step="0.25" value="${st.lw ?? 1}">`)
        + row('Head size', `<input type="range" data-grp="tracks" data-k="headSize" min="0" max="2" step="0.25" value="${st.headSize ?? 1}">`)
        + row('Grid color', `<input type="color" data-grp="grid" data-k="gridColor" value="${hex(st.gridColor, '#dcdcdc')}">`)
        + row('Grid width', `<input type="range" data-grp="grid" data-k="gridLw" min="0" max="4" step="0.25" value="${st.gridLw ?? 0.75}">`)
        + row('background color', `<input type="color" data-grp="background" data-k="faceColor" value="${hex(st.faceColor, '#ffffff')}">`),
    )};

    // ---- event wiring: right-click on the tagged element opens its menu ----
    function bind(nodes, menu) {
      nodes.forEach(n => {
        n.style.pointerEvents = 'all';
        n.addEventListener('contextmenu', e => {
          e.preventDefault();
          e.stopPropagation();
          const r = root.getBoundingClientRect();
          MENUS[menu](e.clientX - r.left, e.clientY - r.top);
        });
      });
    }

    bind(hitNodes('pg:tracks'), 'figure');
    bind(hitNodes('pg:heads'), 'figure');
    bind(hitNodes('pg:grid'), 'figure');
    // background last so figure/background wrappers both open the bg menu
    bind(hitNodes('pg:canvas'), 'figure');

    svg.addEventListener('contextmenu', e => e.preventDefault());
  }

  // ---- fisheye lens for the light transmitted through the panel ----
  // An SVG feDisplacementMap is applied as a backdrop-filter. The displacement
  // map is a radial barrel distortion rendered to a canvas sized to the panel,
  // so the background is magnified at the centre and compressed towards the rim.
  function createFisheyeLens(tip) {
    const noop = { update() {} };
    const supported =
      window.CSS && CSS.supports &&
      (CSS.supports('backdrop-filter', 'url(#pg) blur(1px)') ||
       CSS.supports('-webkit-backdrop-filter', 'url(#pg) blur(1px)'));
    if (!supported) return noop;

    const id = `pg-fisheye-${++lensCount}`;
    const defs = document.createElementNS(SVG_NS, 'svg');
    defs.setAttribute('aria-hidden', 'true');
    defs.setAttribute('width', '0');
    defs.setAttribute('height', '0');
    defs.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
    defs.innerHTML =
      `<filter id="${id}" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"` +
      ` color-interpolation-filters="sRGB" x="0" y="0" width="1" height="1">` +
      `<feImage result="map" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/>` +
      `<feDisplacementMap in="SourceGraphic" in2="map" scale="0"` +
      ` xChannelSelector="R" yChannelSelector="G"/>` +
      `</filter>`;
    document.body.appendChild(defs);

    const filter = defs.querySelector('filter');
    const image = defs.querySelector('feImage');
    const displace = defs.querySelector('feDisplacementMap');
    let size = '';

    function update() {
      const w = Math.round(tip.offsetWidth);
      const h = Math.round(tip.offsetHeight);
      if (!w || !h || size === `${w}x${h}`) return;
      size = `${w}x${h}`;

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      const data = ctx.createImageData(w, h);
      const hw = w / 2;
      const hh = h / 2;
      // Largest displacement of r*(1-r^2)*s occurs at r = 1/sqrt(3).
      const maxShift = FISHEYE_STRENGTH * (2 / (3 * Math.sqrt(3))) * Math.max(hw, hh);
      const scale = Math.max(1, Math.ceil(maxShift * 2));

      for (let y = 0; y < h; y++) {
        const ny = (y + 0.5 - hh) / hh;
        for (let x = 0; x < w; x++) {
          const nx = (x + 0.5 - hw) / hw;
          const r2 = nx * nx + ny * ny;
          // Sample closer to the centre: offset = -s * (1 - r^2) * n.
          const k = r2 < 1 ? -FISHEYE_STRENGTH * (1 - r2) : 0;
          const i = (y * w + x) * 4;
          data.data[i] = Math.round(255 * (0.5 + (k * nx * hw) / scale));
          data.data[i + 1] = Math.round(255 * (0.5 + (k * ny * hh) / scale));
          data.data[i + 2] = 128;
          data.data[i + 3] = 255;
        }
      }
      ctx.putImageData(data, 0, 0);

      [filter, image].forEach(el => {
        el.setAttribute('width', w);
        el.setAttribute('height', h);
      });
      const url = canvas.toDataURL();
      image.setAttribute('href', url);
      image.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
      displace.setAttribute('scale', scale);

      const value = `url(#${id}) ${BACKDROP_BLUR}`;
      tip.style.backdropFilter = value;
      tip.style.webkitBackdropFilter = value;
    }

    if (window.ResizeObserver) new ResizeObserver(update).observe(tip);
    return { update };
  }
})();</script>
