    style.textContent = ":root {\n  --tooltip-border-radius: 1rem;\n  --border-radius: 0.4rem;\n  --border-color: #999;\n}\n\n.peregrin-graph {\n  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;\n}\n\n.peregrin-graph .pg-tooltip {\n  display: none;\n  position: absolute;\n  z-index: 99;\n  padding: 0.4rem 0.8rem 1rem 0.8rem;\n  background: rgba(255, 255, 255, 0.975);\n  border: 1px solid #ddd;\n  border-radius: var(--tooltip-border-radius);\n  box-shadow: 1px 4px 18px 2px rgba(35, 35, 35, 0.25);\n  font-size: 13px;\n  width: 13rem;\n  max-height: 22rem;\n  overflow: auto;\n  transition: background 0.1s ease;\n}\n.peregrin-graph .pg-tooltip.pg-dragged {\n  background: rgba(255, 255, 255, 0.9);\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar {\n  width: 0.4rem;\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar-thumb {\n  background-color: rgba(0, 0, 0, 0.275);\n  border-radius: 0.2rem;\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar-thumb:hover {\n  background-color: rgba(0, 0, 0, 0.4);\n}\n.peregrin-graph .pg-tooltip::-webkit-scrollbar-track { \n  margin-block: 0.9rem;\n  background: transparent;\n}\n\n.peregrin-graph .pg-tooltip .pg-header {\n  position: absolute;\n  top: 0.3rem;\n  width: calc(100% - 2.6rem);\n  cursor: move;\n  user-select: none;\n  touch-action: none;\n  cursor: grab;\n}\n.peregrin-graph .pg-tooltip.pg-dragged .pg-header {\n  cursor: grabbing;\n}\n\n.peregrin-graph .pg-tooltip .pg-close {\n  position: relative;\n  top: -0.1rem;\n  left: calc(100% - 0.5rem);\n  height: 1rem;\n  width: 1rem;\n  cursor: pointer;\n  color: #555;\n}\n.peregrin-graph .pg-tooltip .pg-close:hover {\n  color: black;\n}\n\n\n.peregrin-graph .pg-tooltip input[type=\"color\"] {\n  appearance: none;\n  -moz-appearance: none;\n  -webkit-appearance: none;\n  padding: 0;\n  border: none;\n  border-radius: var(--border-radius);\n  height: 2rem;\n  width: calc(100%);\n  cursor: pointer;\n  margin-top: 0.4rem;\n}\n\n*:focus{\n  display: none;\n  border-radius: 0;\n  outline: none;\n}\n\n::-webkit-color-swatch-wrapper {\n  border-radius: var(--border-radius);\n  padding: 0;\n}\n\n::-webkit-color-swatch{\n  border-radius: var(--border-radius);\n  /* border: none;\n  border-left: 3px solid #aaa;\n  border-right: 3px solid #aaa; */\n  border: 2px solid var(--border-color);\n}\n\n::-moz-color-swatch,\n::-moz-focus-inner{\n  border-radius: var(--border-radius);\n  border: 0;\n}\n\n.peregrin-graph .pg-tooltip input[type=\"range\"] {\n  -webkit-appearance: none;  /* Override default CSS styles */\n  appearance: none;\n  width: 100%;\n  height: 0px;\n  border-radius: 0.8rem;\n  background: none;\n  border: 1px solid var(--border-color);\n  margin: 0.6rem 0 0.6rem 0;\n}\n.peregrin-graph .pg-tooltip input[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none;\n  appearance: none;\n  width: 0.8rem;\n  height: 0.8rem;\n  border-radius: 50%;\n  border: 2px solid var(--border-color);\n  border-left: 2px solid var(--border-color);\n  border-right: 2px solid var(--border-color);\n  background: #fff;\n  cursor: pointer;\n  transition: background 0.1s ease;\n}\n.peregrin-graph .pg-tooltip input[type=\"range\"]::-webkit-slider-thumb:hover {\n  background: var(--border-color);\n}\n\n.pg-graph-submenu {\n  display: flex;\n  margin-top: 0.6rem;\n  gap: 0.6rem;\n}\n.pg-graph-submenu > button {\n  display: inline-flex;\n  align-items: center;\n  padding: 0.4rem 0.5rem 0.4rem 0.5rem;\n  gap: 0.3rem;\n  border-radius: var(--border-radius);\n  border: none;\n  background: #ddd;\n  cursor: pointer;\n  transition: background 0.1s ease, color 0.1s ease;\n}\n.pg-graph-submenu > button:hover {\n  background: #ccc;\n}\n.pg-graph-submenu > button[data-act=\"restore\"]:hover { \n  background: #ed5e5e;\n  color: white;\n}\n\n.peregrin-graph .pg-tooltip select {\n  width: 100%;\n}\n\n.pg-row {\n  margin: 0.6rem 0 0.6rem 0;\n}\n\n.peregrin-graph .pg-tooltip .pg         if (p.getAttribute('stroke') !== 'none') p.setAttribute('stroke', v);
        // matplotlib sometimes puts color in inline style
        if (p.style && p.style.stroke && p.style.stroke !== 'none') p.style.stroke = v;

    }
    function setFill(nodes, v) {
      nodes.forEach(p => {
        if (p.getAttribute('fill') !== 'none') p.setAttribute('fill', v);
        if (p.style && p.style.fill && p.style.fill !== 'none') p.style.fill = v;
      });
    }
    function setStrokeWidth(nodes, v) {
      nodes.forEach(p => {
        p.setAttribute('stroke-width', v);
        if (p.style && p.style.strokeWidth) p.style.strokeWidth = v;
      });
    }
    function setScale(nodes, value) {
      const scale = Number(value);
      if (!Number.isFinite(scale) || scale <= 0) return;

      const uses = nodes.filter(
        node => node.localName === 'use' && !node.closest('defs')
      );

      // Scaling the definition preserves every <use x="..." y="..."> position.
      const definitions = new Set();

        const href =
          use.getAttribute('href') ||
          use.getAttribute('xlink:href') ||
          use.getAttributeNS('http://www.w3.org/1999/xlink', 'href');

        const id = href.slice(1);

          .find(node => node.id === id);

          cy = box.y + box.height / 2;

          node.dataset.pgBaseTransform,
          scaling,
        ].filter(Boolean).join(' ');

        definitions.forEach(scaleAroundCenter);

        .filter(node => !node.closest('defs'))
        .forEach(scaleAroundCenter);

    // A layer in the payload declares a `type` (line | marker | grid |
    // background) and an `id` (matching its `pg:<id>` gid). The archetype maps
    // that type to a `paint` function (how a color is applied — stroke, fill or
    // both) plus the non-color `controls` the panel renders. Color itself is
    // rendered generically from the layer's `color` descriptor (single /
    // categorical / numeric), so any graph becomes editable just by emitting
    // layers — nothing here is specific to tracks.

          controls: arch.controls,
          color: clone(spec.color) || null,
          values: Object.assign({}, spec.values),
          nodes: collect('pg:' + spec.id),
          hits: hitNodes('pg:' + spec.id),
        };
      })
      .filter(layer => (layer.controls.length || layer.color) && (layer.nodes.length || layer.hits.length));

    const layerById = new Map(layers.map(layer => [layer.id, layer]));

    // Immutable snapshot of each layer's initial state for Refresh/restore.
    const ORIGINAL = new Map(
      layers.map(layer => [layer.id, { values: Object.assign({}, layer.values), color: clone(layer.color) }]));

    // ---- color application (mode-aware) ----
    const categoryNodes = (layer, token) => collect('pg:' + layer.id + ':' + token);

    function applyLayerColor(layer) {
      const c = layer.color;
      if (!c) return;
      if (c.mode === 'single') {
        layer.paint(layer.nodes, c.value);
      } else if (c.mode === 'categorical') {
        c.categories.forEach(cat => layer.paint(categoryNodes(layer, cat.token), cat.color));
      } else if (c.mode === 'numeric') {
        const stops = PALETTES.stops[c.cmap];
        const vals = c.values || [];
        layer.nodes.forEach((node, i) => layer.paint([node], sampleCmap(stops, vals[i] ?? 0)));
      }
    }

    function applyColor(layerId, cmode, token, value) {
      const layer = layerById.get(layerId);
      if (!layer || !layer.color) return;
      if (cmode === 'single') {
        layer.color.value = value;
        layer.paint(layer.nodes, value);
      } else if (cmode === 'cat') {
        const cat = layer.color.categories.find(c => c.token === token);
        if (cat) { cat.color = value; layer.paint(categoryNodes(layer, token), value); }
      } else if (cmode === 'cmap') {
        layer.color.cmap = value;
        applyLayerColor(layer);
      }
    }

    // Non-color controls (width, size): applied uniformly to the layer's nodes.
    function applyEdit(layerId, key, value) {
      const layer = layerById.get(layerId);
      if (!layer) return;
      const control = layer.controls.find(c => c.key === key);
      if (!control) return;
      control.apply(layer.nodes, value);
      layer.values[key] = value;
    }

    // ---- export / restore helpers ----
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Clone the live SVG (reflecting any edits) and make it standalone.
    function serializeSvg() {
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', SVG_NS);
      clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      return new XMLSerializer().serializeToString(clone);
    }

    function svgPixelSize() {
      const rect = svg.getBoundingClientRect();
      let w = rect.width;
      let h = rect.height;
      if (!w || !h) {
        const vb = svg.getAttribute('viewBox');
        if (vb) {
          const parts = vb.split(/[ ,]+/).map(Number);
          w = parts[2];
          h = parts[3];
        }
      }
      return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
    }

    function exportSVG() {
      const blob = new Blob([serializeSvg()], {
        type: 'image/svg+xml;charset=utf-8',
      });
      triggerDownload(blob, 'graph.svg');
    }

    function exportPNG() {
      const { w, h } = svgPixelSize();
      const scale = 2; // render at 2x for a crisper raster
      const source = serializeSvg();
      const svgUrl =
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (blob) triggerDownload(blob, 'graph.png');
        }, 'image/png');
      };
      img.src = svgUrl;
    }

    // Restore every editable attribute to the value it had on first render.
    function restore() {
      layers.forEach(layer => {
        const original = ORIGINAL.get(layer.id) || {};
        const values = original.values || {};
        layer.controls.forEach(control => {
          if (!(control.key in values)) return;
          const value = values[control.key];
          control.apply(layer.nodes, value);
          layer.values[control.key] = value;
        });
        if (original.color) {
          layer.color = clone(original.color);
          applyLayerColor(layer);
        }
      });

      // Re-render the open panel so every input reflects the restored state.
      if (panelState) openPanel(panelState.x, panelState.y, panelState.focusId);
    }

    // ---- tooltip UI ----
    const header       = `<div class="pg-header">⋮⋮ <i>tooltip</i></div>`;
    const closeButton  = `<span class="pg-close">✕</span>`;
    const exportIcon =
      `<svg class="pg-btn-icon" xmlns="http://www.w3.org/2000/svg" height="1rem" viewBox="0 -960 960 960" width="1rem" fill="currentColor"><path d="M480-480ZM202-65l-56-57 118-118h-90v-80h226v226h-80v-89L202-65Zm278-15v-80h240v-440H520v-200H240v400h-80v-400q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H480Z"/></svg>`;
    const refreshIcon =
      `<svg class="pg-btn-icon" xmlns="http://www.w3.org/2000/svg" height="1rem" viewBox="0 -960 960 960" width="1rem" fill="currentColor"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>`;
    const graphSubmenu = 
      `<div class="pg-graph-submenu">
        <button type="button" data-act="svg">${exportIcon}SVG</button> <button type="button" data-act="png">${exportIcon}PNG</button> <button type="button" data-act="restore" title="Restore">${refreshIcon}</button>
      </div>`;
    const row = (label, input) =>
      `<div class="pg-row"><label>${label}</label><br>${input}</div>`;


    function showTip(x, y, html) {
      tip.innerHTML = html;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
      tip.style.display = 'block';
      lens.update();
      tip.querySelectorAll('[data-layer][data-k]').forEach(el => {
        el.addEventListener('input', () => {
          let v = el.value;
          if (el.type === 'range') v = parseFloat(v);
          applyEdit(el.dataset.layer, el.dataset.k, v);
        });
      });
      // Color controls: single picker, per-category picker, or colormap select.
      tip.querySelectorAll('[data-layer][data-cmode]').forEach(el => {
        const handler = () => applyColor(el.dataset.layer, el.dataset.cmode, el.dataset.token, el.value);
        el.addEventListener('input', handler);
        el.addEventListener('change', handler);
      });
      const close = tip.querySelector('.pg-close');
      if (close) close.onclick = () => (tip.style.display = 'none');
      tip.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = () => {
          const act = btn.dataset.act;
          if (act === 'svg') exportSVG();
          else if (act === 'png') exportPNG();
          else if (act === 'restore') restore();
        };
      });
    }

    // ---- panel assembly (data-driven) ----
    // Non-color controls (range sliders) from the archetype descriptor.
    function inputHtml(layer, control) {
      const value = layer.values[control.key];
      const base = `data-layer="${layer.id}" data-k="${control.key}"`;
      if (control.input.type === 'color') {
        return `<input type="color" ${base} value="${hex(value, '#000000')}">`;
      }
      const { min = 0, max = 1, step = 0.1 } = control.input;
      return `<input type="range" min="${min}" max="${max}" step="${step}" ${base} value="${value ?? min}">`;
    }

    // Color control, rendered from the layer's color descriptor mode.
    function colorHtml(layer) {
      const c = layer.color;
      if (!c) return '';
      if (c.mode === 'single') {
        return row('Color',
          `<input type="color" data-layer="${layer.id}" data-cmode="single" value="${hex(c.value, '#000000')}">`);
      }
      if (c.mode === 'categorical') {
        return (c.categories || [])
          .map(cat => row(cat.label,
            `<input type="color" data-layer="${layer.id}" data-cmode="cat" data-token="${cat.token}" value="${hex(cat.color, '#000000')}">`))
          .join('');
      }
      if (c.mode === 'numeric') {
        const opts = (PALETTES.quantitative || [])
          .map(name => `<option value="${name}"${name === c.cmap ? ' selected' : ''}>${name}</option>`)
          .join('');
        return row('Colormap',
          `<select data-layer="${layer.id}" data-cmode="cmap">${opts}</select>`);
      }
      return '';
    }

    function sectionHtml(layer) {
      const rows = colorHtml(layer)
        + layer.controls.map(control => row(control.label, inputHtml(layer, control))).join('');
      return `<div class="pg-section"><div class="pg-section-title">${layer.label}</div>${rows}</div>`;
    }

    // One unified panel with a titled section per layer. The right-clicked
    // layer floats to the top so its controls line up with what was clicked.
    function openPanel(x, y, focusId) {
      panelState = { x, y, focusId };
      const ordered = focusId
        ? [...layers].sort((a, b) => (b.id === focusId) - (a.id === focusId))
        : layers;
      const body = ordered.map(sectionHtml).join('');
      showTip(x, y, closeButton + header + graphSubmenu + body);
    }

    // ---- event wiring: right-click on a tagged element opens the panel ----
    function bind(nodes, focusId) {
      nodes.forEach(n => {
        n.style.pointerEvents = 'all';
        n.addEventListener('contextmenu', e => {
          e.preventDefault();
          e.stopPropagation();
          const r = root.getBoundingClientRect();
          openPanel(e.clientX - r.left, e.clientY - r.top, focusId);
        });
      });
    }

    layers.forEach(layer =>
      bind(layer.hits.length ? layer.hits : layer.nodes, layer.id));

    svg.addEventListener('contextmenu', e => e.preventDefault());
  }

  // ---- fisheye lens for the light transmitted through the panel ----
  // An SVG feDisplacementMap is applied as a backdrop-filter. The displacement
  // map is a radial barrel distortion rendered to a canvas sized to the panel,
  // so the background is magnified at the centre and compressed towards the rim.
  function createFisheyeLens(tip) {
    const noop = { update() {} };
    const supported =
      window.CSS && CSS.supports &&
      (CSS.supports('backdrop-filter', 'url(#pg) blur(1px)') ||
       CSS.supports('-webkit-backdrop-filter', 'url(#pg) blur(1px)'));
    if (!supported) return noop;

    const id = `pg-fisheye-${++lensCount}`;
    const defs = document.createElementNS(SVG_NS, 'svg');
    defs.setAttribute('aria-hidden', 'true');
    defs.setAttribute('width', '0');
    defs.setAttribute('height', '0');
    defs.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
    defs.innerHTML =
      `<filter id="${id}" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"` +
      ` color-interpolation-filters="sRGB" x="0" y="0" width="1" height="1">` +
      `<feImage result="map" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/>` +
      `<feDisplacementMap in="SourceGraphic" in2="map" scale="0"` +
      ` xChannelSelector="R" yChannelSelector="G"/>` +
      `</filter>`;
    document.body.appendChild(defs);

    const filter = defs.querySelector('filter');
    const image = defs.querySelector('feImage');
    const displace = defs.querySelector('feDisplacementMap');
    let size = '';

    function update() {
      const w = Math.round(tip.offsetWidth);
      const h = Math.round(tip.offsetHeight);
      if (!w || !h || size === `${w}x${h}`) return;
      size = `${w}x${h}`;

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      const data = ctx.createImageData(w, h);
      const hw = w / 2;
      const hh = h / 2;
      // Largest displacement of r*(1-r^2)*s occurs at r = 1/sqrt(3).
      const maxShift = FISHEYE_STRENGTH * (2 / (3 * Math.sqrt(3))) * Math.max(hw, hh);
      const scale = Math.max(1, Math.ceil(maxShift * 2));

      for (let y = 0; y < h; y++) {
        const ny = (y + 0.5 - hh) / hh;
        for (let x = 0; x < w; x++) {
          const nx = (x + 0.5 - hw) / hw;
          const r2 = nx * nx + ny * ny;
          // Sample closer to the centre: offset = -s * (1 - r^2) * n.
          const k = r2 < 1 ? -FISHEYE_STRENGTH * (1 - r2) : 0;
          const i = (y * w + x) * 4;
          data.data[i] = Math.round(255 * (0.5 + (k * nx * hw) / scale));
          data.data[i + 1] = Math.round(255 * (0.5 + (k * ny * hh) / scale));
          data.data[i + 2] = 128;
          data.data[i + 3] = 255;
        }
      }
      ctx.putImageData(data, 0, 0);

      [filter, image].forEach(el => {
        el.setAttribute('width', w);
        el.setAttribute('height', h);
      });
      const url = canvas.toDataURL();
      image.setAttribute('href', url);
      image.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
      displace.setAttribute('scale', scale);

      const value = `url(#${id}) ${BLUR_BACKDROP}`;
      tip.style.backdropFilter = value;
      tip.style.webkitBackdropFilter = value;
    }

    if (window.ResizeObserver) new ResizeObserver(update).observe(tip);
    return { update };
  }
})();</script>
